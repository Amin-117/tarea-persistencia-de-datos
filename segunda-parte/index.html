<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Alumnos - Local</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Cargar Alumno</h2>
    <form id="alumnoForm">
        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="number" id="edad" placeholder="Edad" required>
        <input type="number" id="nota" placeholder="Nota" step="0.1" required>
        <button type="submit">Cargar y Recargar</button>
    </form>

    <h2>Listado Ordenado</h2>
    <table id="tablaAlumnos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Edad</th>
                <th>Nota</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
       // Dentro del script de index.html para la Parte 2
async function cargarDesdeServidor() {
    const res = await fetch('/api/alumnos');
    const alumnos = await res.json();
    
    const tabla = document.querySelector('#tablaAlumnos tbody');
    tabla.innerHTML = alumnos.map(a => `
        <tr>
            <td>${a.nombre}</td>
            <td>${a.edad}</td>
            <td>${a.nota}</td>
        </tr>
    `).join('');
}

// Cambiar el listener del formulario
document.getElementById('alumnoForm').action = '/api/alumnos';
document.getElementById('alumnoForm').method = 'POST';

cargarDesdeServidor();
    </script>
</body>
</html>
