<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Alumnos</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        form { display: flex; flex-direction: column; gap: 10px; background: #eee; padding: 15px; border-radius: 5px; }
        input { padding: 8px; }
        button { padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <h2>Cargar Alumno</h2>
    <form action="/api/alumnos" method="POST">
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="number" name="edad" placeholder="Edad" required>
        <input type="number" name="nota" placeholder="Nota" step="0.1" required>
        <button type="submit">Enviar Datos</button>
    </form>

    <h2>Lista Ordenada</h2>
    <table>
        <thead>
            <tr><th>Nombre</th><th>Edad</th><th>Nota</th></tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script>
        fetch('/api/alumnos')
            .then(res => res.json())
            .then(alumnos => {
                const lista = document.getElementById('lista');
                lista.innerHTML = alumnos.map(a => `
                    <tr>
                        <td>${a.nombre}</td>
                        <td>${a.edad}</td>
                        <td>${a.nota}</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
